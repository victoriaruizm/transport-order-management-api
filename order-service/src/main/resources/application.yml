server:
  port: 8081
  forward-headers-strategy: framework

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=orders_db;encrypt=true;trustServerCertificate=true}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

driver-service:
  url: ${DRIVER_SERVICE_URL:http://localhost:8082}

jwt:
  secret: ${JWT_SECRET}

auth:
  username: ${AUTH_USER}
  password: ${AUTH_PASSWORD}

logging:
  structured:
    format:
      console: ecs
