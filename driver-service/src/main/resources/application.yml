server:
  port: 8082
  forward-headers-strategy: framework

spring:
  application:
    name: driver-service
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=drivers_db;encrypt=true;trustServerCertificate=true}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

logging:
  structured:
    format:
      console: ecs
